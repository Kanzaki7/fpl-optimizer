# Chaque matin, et à chaque changement du modèle : collecte des données FPL,
# modèle, optimisation, puis commit des fichiers du site (redéploiement Vercel).
name: Données quotidiennes

on:
  schedule:
    - cron: "17 5 * * *"   # 5 h 17 UTC, après les changements de prix de la nuit
  push:
    branches: [main]
    paths: ["pipeline/**"]
  workflow_dispatch:
    inputs:
      notify_now:
        description: "Envoyer les alertes e-mail maintenant (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Pipeline
        id: pipeline
        run: python -m pipeline
      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data data/cache
          if git diff --staged --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Données : mise à jour du $(date -u +%Y-%m-%d)"
            git push
          fi
      # la veille de chaque date limite (ou sur demande) : transferts conseillés
      # par e-mail ; un échec ici n'empêche jamais la mise à jour des données
      - name: Alertes e-mail
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: https://fpl-optimizer-beta.vercel.app
        run: python -m pipeline.notify ${{ inputs.notify_now && '--force' || '' }}
